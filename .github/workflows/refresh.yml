name: refresh

# Twice-daily server-side refresh of the Cars.com asking medians (runs scripts/refresh.py
# on GitHub's servers, so the page updates without anyone's computer being on).
on:
  schedule:
    - cron: '23 14 * * *'   # 14:23 UTC (~07:23 PT)
    - cron: '23 2 * * *'    # 02:23 UTC (~18:23 PT)
  workflow_dispatch: {}      # also lets the dashboard ↻ button trigger it

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Refresh data.json (Cars.com asking medians)
        run: python scripts/refresh.py
      - name: Refresh BaT sold history (stdlib only, no browser)
        run: python scripts/bat_refresh.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # appreciation.csv is rewritten by bat_refresh.py on every run and is what
          # the WEEKEND CAR VERDICT sheet pulls with IMPORTDATA. Staging only
          # data.json left it frozen at whatever was last committed by hand.
          if ! git diff --quiet -- data.json appreciation.csv; then
            git add data.json appreciation.csv
            git commit -m "refresh: Cars.com asking + BaT sold $(date -u +%Y-%m-%dT%H:%MZ)"
            # A scrape takes minutes, so main can move underneath us (a local push, or
            # the dashboard's manual trigger). Rebase and retry rather than failing the
            # run — the commit only ever touches data.json, so a rebase is safe.
            for i in 1 2 3; do
              if git push; then
                echo "pushed on attempt $i"
                exit 0
              fi
              echo "push rejected on attempt $i — rebasing onto origin/main"
              git pull --rebase origin main || { git rebase --abort || true; echo "rebase conflict — skipping cycle"; exit 0; }
            done
            echo "could not push after 3 attempts — skipping this cycle"
          else
            echo "no change"
          fi
