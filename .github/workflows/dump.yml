name: dump-sales-temp
on:
  push:
    branches: [claude/sales-dump]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python _dump/dump_sales.py
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _dump/sales.json
          git commit -m "temp: sales dump [skip ci]" && git push
